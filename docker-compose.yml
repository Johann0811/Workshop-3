services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: happiness-kafka
    user: root
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  postgres:
    image: postgres:16
    container_name: happiness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-happiness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-happiness} 
      POSTGRES_DB: ${POSTGRES_DB:-happiness_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./sql/kpis.sql:/docker-entrypoint-initdb.d/02_kpis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kafka_data:
  postgres_data: